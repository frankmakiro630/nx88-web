version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nx88_postgres
    environment:
      POSTGRES_DB: nx88_casino
      POSTGRES_USER: nx88_user
      POSTGRES_PASSWORD: nx88_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nx88_user -d nx88_casino"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nx88_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
